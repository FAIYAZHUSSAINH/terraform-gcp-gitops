version: 3

projects:
  - name: vpc
    dir: resources/vpc
    workflow: vpc-dev
    autoplan:
      enabled: true
      when_modified:
        - "**/*.tf"
        - ".terraform.lock.hcl"
        - "../../variables/dev/vpc.tfvars"
        - "../../backend/dev/vpc.hcl"
        - "../../atlantis.yaml"

  - name: vm
    dir: resources/vm
    workflow: vm-dev
    autoplan:
      enabled: true
      when_modified:
        - "**/*.tf"
        - ".terraform.lock.hcl"
        - "../../variables/dev/vm.tfvars"
        - "../../backend/dev/vm.hcl"
        - "../../atlantis.yaml"

  - name: storage
    dir: resources/storage
    workflow: storage-dev
    autoplan:
      enabled: true
      when_modified:
        - "**/*.tf"
        - ".terraform.lock.hcl"
        - "../../variables/dev/storage.tfvars"
        - "../../backend/dev/storage.hcl"
        - "../../atlantis.yaml"

workflows:
  vpc-dev:
    plan:
      steps:
        - init:
            extra_args:
              - "-reconfigure"
              - "-backend-config=../../backend/dev/vpc.hcl"
        - plan:
            extra_args:
              - "-var-file=../../variables/dev/vpc.tfvars"

  vm-dev:
    plan:
      steps:
        - init:
            extra_args:
              - "-reconfigure"
              - "-backend-config=../../backend/dev/vm.hcl"
        - plan:
            extra_args:
              - "-var-file=../../variables/dev/vm.tfvars"

  storage-dev:
    plan:
      steps:
        - init:
            extra_args:
              - "-reconfigure"
              - "-backend-config=../../backend/dev/storage.hcl"
        - plan:
            extra_args:
              - "-var-file=../../variables/dev/storage.tfvars"
